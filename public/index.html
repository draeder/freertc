<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FreeRTC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
    <style>
      /* The Pigeon look (PigeonAI, PigeonFS, PigeonChess): Pickled Bluewood and Cruise; mint for what is live. */
      :root {
        color-scheme: dark;
        --night: #2a3747;
        --night-2: #223040;
        --line: #3a4a5e;
        --line-strong: #46586e;
        --bright: #e8f6f9;
        --bone: #bee6ee;
        --bone-2: #9dbfc8;
        --bone-3: #8aa7b3;
        --sheen: #7fd8a6;
        --info: #9cc3f5;
        --warm: #f2c879;
        --bad: #f29b91;
        --on-bone: #1e2a37;
        --font: 'Archivo', system-ui, sans-serif;
        --mono: ui-monospace, 'SF Mono', Menlo, monospace;
        /* names the rest of the page uses */
        --ink: var(--bone);
        --ink-soft: var(--bone-2);
        --muted: var(--bone-3);
        --success: var(--sheen);
        --warn: var(--warm);
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        min-height: 100vh;
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.45;
        color: var(--bone);
        background: var(--night);
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; }
      #app { min-height: 100vh; }
      .shell { width: min(1240px, 100%); margin: 0 auto; display: grid; gap: 0; padding: 0 20px 32px; }

      /* Panels: separated by lines, not floating cards. */
      .card { background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 20px 0; box-shadow: none; }
      .stack { display: grid; gap: 12px; }
      .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

      /* Top bar */
      .hero { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; padding: 0; }
      .hero-compact { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
      .brand-lockup { display: inline-flex; align-items: center; gap: 10px; }
      .logo-badge { width: 24px; height: 24px; display: grid; place-items: center; }
      .brand-icon { width: 22px; height: 22px; display: block; }
      .brand-icon circle, .brand-icon path { stroke: var(--bone); }
      .brand-icon circle[fill]:not([fill="none"]) { fill: var(--bone); }
      .hero-compact h1, .brand-wordmark { margin: 0; font-weight: 800; font-stretch: 125%; font-size: 1.05rem; letter-spacing: -0.01em; text-transform: none; }
      .brand-free { color: var(--bright); }
      .brand-rtc { color: var(--bone); }
      .hero-copy { margin: 0; color: var(--bone-2); font-size: 0.9rem; max-width: 44rem; }
      .inline-link, .pill-link { color: var(--bone); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
      .inline-link:hover, .pill-link:hover { text-decoration-color: var(--sheen); }
      .hero-status { display: flex; align-items: center; gap: 10px; min-width: 0; }

      /* Status and small labels: plain text with a dot, no pills. */
      .status-pill, .pill { display: inline-flex; align-items: center; gap: 8px; padding: 0; border: 0; background: none; color: var(--bone-2); font-size: 0.85rem; text-transform: none; letter-spacing: 0; border-radius: 0; }
      .status-pill strong, .pill strong { font-weight: 500; }
      .status-pill::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--bone-3); }
      .status-pill.connected { color: var(--bright); }
      .status-pill.connected::before { background: var(--sheen); animation: pulse 1.6s ease-out infinite; }
      .status-pill.connecting::before { background: var(--info); }
      .status-pill.disconnected::before { background: var(--bad); }
      @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--sheen) 60%, transparent); } 100% { box-shadow: 0 0 0 7px transparent; } }
      @media (prefers-reduced-motion: reduce) { .status-pill.connected::before { animation: none; } }
      .pill.pill-warn { color: var(--warm); }
      .pill.pill-ok { color: var(--sheen); }

      .panel-title { margin: 0; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--bone-3); }
      .section-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
      .spec-warning-card { border-bottom-color: color-mix(in srgb, var(--warm) 40%, var(--line)); }
      .spec-warning-list { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
      .spec-warning-item { color: var(--warm); font-size: 0.88rem; }

      /* Layout */
      .headline-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 0 28px; }
      .control-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 0 28px; }
      .headline-grid > .card + .card, .control-grid > * + * { border-left: 1px solid var(--line); padding-left: 24px; }
      .sidebar-stack { display: grid; gap: 0; align-content: start; }
      .info-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
      .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }

      /* Fields */
      .stat-card { display: grid; gap: 6px; min-width: 0; padding: 0; background: none; border: 0; border-radius: 0; min-height: 0; }
      .stat-label, label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--bone-3); }
      label { display: grid; gap: 6px; }
      .stat-value { font-size: 1rem; word-break: break-word; }
      .mono, input, textarea, select, .log, code { font-family: var(--mono); }
      input, textarea, select, .stat-input {
        width: 100%; font-size: 14px; line-height: 1.5; color: var(--bone);
        background: var(--night-2); border: 1px solid var(--line-strong); border-radius: 6px; padding: 9px 12px;
      }
      input:focus, textarea:focus, select:focus { outline: none; border-color: var(--sheen); }
      textarea { min-height: 160px; resize: vertical; }

      /* Buttons: one style, quiet secondary. */
      button {
        appearance: none; font: inherit; font-size: 0.9rem; color: var(--bone);
        padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--night-2);
        cursor: pointer; white-space: nowrap; transition: border-color 120ms ease;
      }
      button:hover:not(:disabled) { border-color: var(--sheen); }
      button:focus-visible { outline: 2px solid var(--sheen); outline-offset: 1px; }
      button:disabled { opacity: 0.5; cursor: default; }
      button:not(.secondary):not(.tab):not(.mode-btn):not(.mesh-row) { font-weight: 600; }
      button.secondary { color: var(--bone-2); }
      button.secondary.active { color: var(--bone); border-color: var(--sheen); }
      .tabs { display: inline-flex; gap: 2px; padding: 0; border: 0; background: none; }
      .tab { min-width: 0; color: var(--bone-2); border-color: transparent; background: none; padding: 6px 10px; text-transform: none; letter-spacing: 0; font-size: 0.9rem; }
      .tab.active { color: var(--bone); border-color: var(--line-strong); background: var(--night-2); }
      .mode-toggle { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
      .mode-btn { border: 0; border-radius: 0; background: none; color: var(--bone-2); padding: 6px 12px; font-size: 0.85rem; }
      .mode-btn + .mode-btn { border-left: 1px solid var(--line-strong); }
      .mode-btn.active { background: var(--night-2); color: var(--bone); }
      .mode-indicator { margin: 0; font-size: 0.85rem; color: var(--bone-2); }
      .console-action-btn { min-width: 120px; }

      /* Readouts */
      .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); }
      .metric { margin: 0; padding: 10px 12px 10px 0; border: 0; background: none; border-radius: 0; min-width: 0; }
      .metric dt { margin: 0 0 4px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--bone-3); }
      .metric dd { margin: 0; font-size: 0.92rem; font-variant-numeric: tabular-nums; }
      .peer-value { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .runtime-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); }
      .runtime-chip { padding: 10px 12px 10px 0; border: 0; background: none; border-radius: 0; min-width: 0; }
      .runtime-chip.ok .runtime-value { color: var(--sheen); }
      .runtime-chip.warn .runtime-value { color: var(--warm); }
      .runtime-label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--bone-3); margin-bottom: 4px; }
      .runtime-value { font-size: 0.92rem; color: var(--bright); min-width: 0; }
      .runtime-route-value { white-space: normal; overflow-wrap: anywhere; }

      /* Peers */
      .mesh-list { display: grid; gap: 0; }
      .mesh-row { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; text-align: left; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: none; color: var(--bone); font-weight: 400; }
      .mesh-row:last-child { border-bottom: 1px solid var(--line); }
      .mesh-row:hover:not(:disabled) { border-color: var(--line); background: var(--night-2); }
      .mesh-row.is-selected { background: var(--night-2); box-shadow: inset 2px 0 0 var(--sheen); padding-left: 10px; }
      .mesh-main { display: grid; gap: 2px; min-width: 0; }
      .mesh-peer-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
      .mesh-peer { font-size: 0.85rem; color: var(--bright); }
      .mesh-badges { display: inline-flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
      .mesh-badge { padding: 0; border: 0; background: none; border-radius: 0; font-size: 0.78rem; text-transform: none; letter-spacing: 0; color: var(--bone-2); }
      .mesh-badge.ok { color: var(--sheen); }
      .mesh-badge.warn { color: var(--warm); }
      .mesh-badge.error { color: var(--bad); }
      .mesh-badge.idle { color: var(--bone-3); }
      .mesh-badge.mesh-role, .mesh-badge.mesh-role.responder { color: var(--info); }
      .mesh-state-line { color: var(--bone-3); font-size: 0.78rem; }
      .mesh-empty { min-height: 96px; }
      .mesh-helper { margin: 0; font-size: 0.85rem; color: var(--bone-2); }

      /* Chat */
      .chat-composer { gap: 10px; padding: 0; border: 0; background: none; }
      .chat-label { gap: 6px; text-transform: none; letter-spacing: 0; font-size: 0.85rem; color: var(--bone-2); font-weight: 400; }
      .chat-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
      .chat-send-btn { min-width: 88px; }
      .chat-thread { display: flex; flex-direction: column; gap: 8px; height: 320px; overflow-y: auto; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--night-2); }
      .chat-row { display: flex; }
      .chat-row.outgoing { justify-content: flex-end; }
      .chat-bubble { width: fit-content; max-width: min(100%, 32rem); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--night); }
      .chat-row.outgoing .chat-bubble { border-color: color-mix(in srgb, var(--sheen) 45%, var(--line)); }
      .chat-row.system .chat-bubble { color: var(--bone-2); }
      .chat-row.error .chat-bubble { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); color: var(--bad); }
      .chat-meta { margin-bottom: 4px; color: var(--bone-3); font-size: 0.75rem; }
      .chat-body { color: var(--bright); font-size: 0.92rem; white-space: pre-wrap; word-break: break-word; }
      .chat-empty { height: 320px; display: grid; place-items: center; padding: 14px; border: 1px dashed var(--line-strong); border-radius: 6px; color: var(--bone-3); text-align: center; background: var(--night-2); }

      /* Logs */
      .console-card, .debug-card { background: none; color: var(--bone); border: 0; border-bottom: 1px solid var(--line); }
      .debug-card { min-height: 0; }
      .console-card .panel-title, .debug-card .panel-title, .console-card .muted, .debug-card .muted { color: var(--bone-3); }
      .log { background: var(--night-2); border: 1px solid var(--line); border-radius: 6px; min-height: 220px; max-height: 220px; overflow: auto; padding: 10px 12px; font-size: 0.8rem; white-space: pre-wrap; word-break: break-word; line-height: 1.5; color: var(--bone-2); }
      .log-preview { margin: 0; padding: 0; border: 0; background: none; display: grid; gap: 0; min-height: 0; max-height: 260px; overflow: auto; font-size: 0.82rem; }
      .log-preview-head { font-size: 0.78rem; color: var(--bone-3); padding-bottom: 6px; }
      .log-preview-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 0; }
      .log-preview-item { display: grid; gap: 1px; padding: 6px 0; border-top: 1px solid var(--line); background: none; border-radius: 0; }
      .log-preview-time { color: var(--bone-3); font-size: 0.72rem; font-variant-numeric: tabular-nums; }
      .log-preview-label { color: var(--bright); font-size: 0.82rem; }
      .log-preview-text { color: var(--bone-2); font-size: 0.78rem; word-break: break-word; }
      .muted { color: var(--bone-2); font-size: 0.88rem; }
      code { display: inline; background: var(--night-2); padding: 1px 6px; border-radius: 4px; font-size: 0.88em; }
      .footer-note { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--bone-3); font-size: 0.8rem; }

      @media (max-width: 980px) {
        .headline-grid, .control-grid { grid-template-columns: 1fr; }
        .headline-grid > .card + .card, .control-grid > * + * { border-left: 0; padding-left: 0; }
        .field-grid, .info-grid { grid-template-columns: 1fr; }
        .runtime-strip, .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .hero { flex-direction: column; align-items: flex-start; padding: 12px 0; }
      }
      @media (max-width: 560px) {
        .shell { padding: 0 16px 24px; }
        .runtime-strip, .metrics { grid-template-columns: 1fr; }
        .mode-toggle, .tabs { width: 100%; }
        .mode-btn, .tab { flex: 1; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
